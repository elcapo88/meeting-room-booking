name: Build & Test Docker Environment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and start containers
      run: |
        docker compose up -d --build

    - name: Wait for services to become healthy
      run: |
        for i in {1..30}; do
          STATUS=$(docker inspect --format='{{json .State.Health.Status}}' meetsol-api 2>/dev/null || echo "unhealthy")
          if [ "$STATUS" == "\"healthy\"" ]; then
            echo "API is healthy!"
            break
          fi
          echo "Waiting for API to be healthy ($i/30)..."
          sleep 2
        done

    - name: Test Backend Health Endpoint
      run: |
        curl --fail http://localhost:4000/api/health

    - name: Test Frontend Web Service
      run: |
        curl --fail http://localhost:8080/

    - name: Stop containers
      if: always()
      run: |
        docker compose down
